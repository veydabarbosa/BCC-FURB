<!DOCTYPE html>
<html>

<head>
    <title>Exercício HTML – parte 2</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>Formulário</header>

    <form>
        <label>Nome:</label>
        <input type="text">

        <label>Idade:</label>
        <input type="number">

        <label>Data de nascimento:</label>
        <input type="date">

        <label>Email:</label>
        <input type="email">

        <label>Senha:</label>
        <input type="password">

        <label>Telefone:</label>
        <input type="tel">

        <button type="submit" class="botao">Enviar</button>
        <button type="reset" class="botao">Limpar</button>
    </form>

</body>
</html>
